
<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IHSNOCT - Chat</title>
<style>
:root {
  --blue: #2489ff;
  --blue-dark: #1675df;
  --bg: #edf3fa;
  --white: #ffffff;
  --text: #182638;
  --muted: #8190a3;
  --border: #e6edf5;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  font-family: Arial, "Noto Sans Bengali", sans-serif;
  background: var(--bg);
  color: var(--text);
}
button, input { font: inherit; }
button { cursor: pointer; }
.app {
  max-width: 1250px;
  height: 100dvh;
  max-height: 950px;
  min-height: 500px;
  margin: 0 auto;
  background: var(--white);
  display: flex;
  overflow: hidden;
  box-shadow: 0 8px 40px #263b5512;
}
.sidebar {
  width: 330px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}
.brand {
  display: flex;
  align-items: center;
  gap: 11px;
  padding: 21px 18px;
  border-bottom: 1px solid var(--border);
}
.logo {
  width: 43px;
  height: 43px;
  border-radius: 15px;
  background: linear-gradient(135deg,#38a5ff,#1675df);
  color: white;
  display: grid;
  place-items: center;
  font-size: 22px;
  font-weight: bold;
}
.brand-name { font-size: 20px; font-weight: 800; }
.brand-sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
.search-wrap { padding: 15px; }
.search {
  width: 100%;
  border: 1px solid var(--border);
  background: #f4f7fb;
  border-radius: 12px;
  padding: 12px 14px;
  outline: none;
}
.search:focus, .message-input:focus {
  border-color: var(--blue);
}
.section-title {
  padding: 0 18px 12px;
  color: var(--muted);
  font-size: 12px;
  font-weight: bold;
  letter-spacing: .5px;
}
.chat-item {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 9px;
  padding: 13px 10px;
  border-radius: 13px;
  background: #edf6ff;
}
.avatar {
  width: 45px;
  height: 45px;
  flex-shrink: 0;
  display: grid;
  place-items: center;
  border-radius: 50%;
  color: white;
  background: linear-gradient(135deg,#44b8ff,#2478ee);
  font-weight: bold;
  font-size: 17px;
}
.chat-title { font-weight: bold; font-size: 14px; }
.chat-preview {
  color: var(--muted);
  font-size: 12px;
  margin-top: 5px;
  overflow-wrap: anywhere;
}
.sidebar-note {
  margin-top: auto;
  padding: 15px;
  color: var(--muted);
  font-size: 11px;
  line-height: 1.6;
  border-top: 1px solid var(--border);
}
.main {
  min-width: 0;
  flex: 1;
  display: flex;
  flex-direction: column;
  background: #f8fbff;
}
.topbar {
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
}
.topbar .avatar { width: 42px; height: 42px; }
.online { color: #1aa775; font-size: 12px; margin-top: 5px; }
.top-actions { margin-left: auto; }
.icon-btn {
  border: 0;
  background: #eef6ff;
  color: var(--blue-dark);
  border-radius: 10px;
  padding: 10px 12px;
}
.messages {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 24px clamp(12px,4vw,40px);
  display: flex;
  flex-direction: column;
  gap: 14px;
}
.welcome {
  align-self: center;
  max-width: 340px;
  background: #e8f3ff;
  color: #42617e;
  border: 1px solid #d9eaff;
  border-radius: 14px;
  padding: 12px 16px;
  font-size: 13px;
  line-height: 1.7;
  text-align: center;
  margin: auto 0;
}
.bubble {
  align-self: flex-end;
  max-width: min(78%,520px);
  background: #dceeff;
  border: 1px solid #d0e7ff;
  padding: 12px 15px 8px;
  border-radius: 17px 17px 5px 17px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  line-height: 1.55;
  box-shadow: 0 2px 5px #245d9010;
}
.time {
  text-align: right;
  font-size: 10px;
  color: #6d8aa7;
  margin-top: 6px;
}
.composer-wrap {
  background: white;
  padding: 13px 18px 16px;
  border-top: 1px solid var(--border);
}
.composer {
  display: flex;
  align-items: center;
  gap: 10px;
  max-width: 850px;
  margin: auto;
}
.message-input {
  flex: 1;
  min-width: 0;
  border: 1px solid var(--border);
  background: #f5f8fc;
  border-radius: 15px;
  padding: 14px 16px;
  outline: none;
}
.send {
  border: 0;
  border-radius: 14px;
  background: var(--blue);
  color: white;
  padding: 14px 20px;
  font-weight: bold;
  box-shadow: 0 4px 10px #2489ff35;
}
.send:hover { background: var(--blue-dark); }
.footer {
  text-align: center;
  color: var(--muted);
  font-size: 10px;
  padding-top: 10px;
}
.mobile-brand { display: none; }

@media (max-width: 650px) {
  .app {
    height: 100dvh;
    min-height: 0;
    max-height: none;
  }
  .sidebar { display: none; }
  .topbar { padding: 12px; gap: 10px; }
  .mobile-brand { display: block; }
  .topbar .avatar { width: 39px; height: 39px; }
  .top-actions { display: none; }
  .messages { padding: 16px 12px; gap: 12px; }
  .bubble { max-width: 88%; }
  .composer-wrap { padding: 10px 10px 12px; }
  .composer { gap: 7px; }
  .message-input { padding: 13px 11px; font-size: 14px; }
  .send { padding: 13px 14px; }
}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">I</div>
      <div>
        <div class="brand-name">IHSNOCT</div>
        <div class="brand-sub">Connect • Chat • Share</div>
      </div>
    </div>
    <div class="search-wrap">
      <input class="search" id="search" placeholder="🔎 চ্যাট খুঁজুন..." />
    </div>
    <div class="section-title">MESSAGES</div>
    <div class="chat-item" id="chatItem">
      <div class="avatar">I</div>
      <div style="min-width:0">
        <div class="chat-title">IHSNOCT Chat</div>
        <div class="chat-preview" id="preview">আপনার ব্যক্তিগত চ্যাট</div>
      </div>
    </div>
    <div class="sidebar-note">
      IHSNOCT — আপনার নিজস্ব চ্যাট প্রজেক্ট।<br>
      এই সংস্করণে মেসেজ এই ব্রাউজারে সেভ হয়।
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="avatar">I</div>
      <div class="mobile-brand">
        <div class="brand-name">IHSNOCT</div>
        <div class="online">● আপনার চ্যাট</div>
      </div>
      <div class="top-actions">
        <button class="icon-btn" id="clearBtn">মেসেজ মুছুন</button>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="welcome" id="welcome">
        👋 <strong>IHSNOCT-এ স্বাগতম!</strong><br>
        আপনার প্রথম মেসেজটি নিচে লিখুন।
      </div>
    </section>

    <div class="composer-wrap">
      <form class="composer" id="chatForm">
        <input class="message-input" id="messageInput"
          placeholder="মেসেজ লিখুন..." autocomplete="off" />
        <button class="send" type="submit">➤ Send</button>
      </form>
      <div class="footer">Enter চাপলে মেসেজ পাঠানো যাবে • IHSNOCT</div>
    </div>
  </main>
</div>

<script>
(function () {
  const KEY = 'ihsnoct_saved_messages_v2';
  const form = document.getElementById('chatForm');
  const input = document.getElementById('messageInput');
  const messages = document.getElementById('messages');
  const preview = document.getElementById('preview');
  const search = document.getElementById('search');
  const clearBtn = document.getElementById('clearBtn');

  let items = [];

  function load() {
    try {
      const saved = localStorage.getItem(KEY);
      const parsed = saved ? JSON.parse(saved) : [];
      items = Array.isArray(parsed) ? parsed.filter(
        x => x && typeof x.text === 'string'
      ) : [];
    } catch (e) {
      items = [];
    }
    render();
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(items));
    } catch (e) {
      alert('মেসেজ সেভ করা যায়নি। ব্রাউজারের স্টোরেজ পরীক্ষা করুন।');
    }
  }

  function render() {
    messages.innerHTML = '';

    if (items.length === 0) {
      const welcome = document.createElement('div');
      welcome.className = 'welcome';
      welcome.innerHTML =
        '👋 <strong>IHSNOCT-এ স্বাগতম!</strong><br>আপনার প্রথম মেসেজটি নিচে লিখুন।';
      messages.appendChild(welcome);
      preview.textContent = 'আপনার ব্যক্তিগত চ্যাট';
      return;
    }

    const query = search.value.trim().toLowerCase();
    let shown = 0;

    items.forEach(item => {
      if (query && !item.text.toLowerCase().includes(query)) return;

      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      const text = document.createElement('div');
      text.textContent = item.text;

      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = item.time || '';

      bubble.appendChild(text);
      bubble.appendChild(time);
      messages.appendChild(bubble);
      shown++;
    });

    if (shown === 0) {
      const empty = document.createElement('div');
      empty.className = 'welcome';
      empty.textContent = 'কোনো মেসেজ পাওয়া যায়নি।';
      messages.appendChild(empty);
    }

    preview.textContent = items[items.length - 1].text;
    messages.scrollTop = messages.scrollHeight;
  }

  form.addEventListener('submit', function (event) {
    event.preventDefault();
    const text = input.value.trim();
    if (!text) return;

    items.push({
      text: text,
      time: new Date().toLocaleTimeString('bn-BD', {
        hour: '2-digit',
        minute: '2-digit'
      })
    });

    save();
    input.value = '';
    render();
    input.focus();
  });

  search.addEventListener('input', render);

  clearBtn.addEventListener('click', function () {
    if (!items.length) {
      alert('মুছে ফেলার মতো কোনো মেসেজ নেই।');
      return;
    }
    if (confirm('আপনার এই ব্রাউজারের সব সেভ করা মেসেজ মুছবেন?')) {
      items = [];
      save();
      render();
    }
  });

  load();
})();
</script>
</body>
  </html>
